langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY}
      model-name: qwen-plus
      log-responses: true
      log-requests: true
      strict-tools: true
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY}
      model-name: qwen-plus
      log-responses: true
      log-requests: true
      strict-tools: true
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${EMBEDDING_API_KEY}
      model-name: text-embedding-v4
      log-requests: true
      log-responses: true
      max-segments-per-batch: 10
  web-search-engine:
    tavily:
      api-key: ${TAVILY_API_KEY}  # 从环境变量读取API Key
      max-results: 3              # 最多返回3条搜索结果

  community:
    redis:
      host: localhost
      port: 6379

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/embedding
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

kui:
  pgvector:
    host: localhost
    port: 5432
    database: embedding
    user: postgres
    password: root
    table: embedding_store
  content:
    auto-load-on-startup: false
    base-path: content

logging:
  level:
    dev.langchain4j: debug
    com.example.kui: info
