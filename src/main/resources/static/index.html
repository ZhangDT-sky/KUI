<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUI Chat</title>
    <style>
        :root {
            font-family: "Segoe UI", "PingFang SC", sans-serif;
            color: #1f2933;
            background: #f5f6f8;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            background: #f5f6f8;
        }
        .app {
            flex: 1;
            display: flex;
        }
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #f1f2f4;
        }
        .brand {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            border: 1px dashed #c7ced6;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .new-chat-btn:hover {
            background: #eef2ff;
            border-color: #818cf8;
            color: #4c51c6;
        }
        .history {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 16px;
        }
        .thread {
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: background 0.2s ease;
        }
        .thread.active {
            background: #eef2ff;
        }
        .thread-title {
            font-size: 15px;
            font-weight: 600;
            color: #1f2933;
        }
        .thread-preview {
            font-size: 13px;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-pane,
        .comment-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .comment-pane {
            background: #f5f6f8;
        }
        .chat-header {
            padding: 24px 28px 12px;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
        }
        .chat-header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }
        .chat-header p {
            margin: 8px 0 0;
            color: #6b7280;
            font-size: 14px;
        }
        .comment-header {
            padding: 24px 28px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .comment-header h1 {
            margin: 0;
            font-size: 22px;
        }
        .comment-header button {
            border: none;
            background: #e5e7eb;
            color: #1f2933;
            border-radius: 10px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
        }
        .comment-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px 28px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .comment-card {
            background: #fff;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
        }
        .comment-card h3 {
            margin: 0 0 6px;
            font-size: 15px;
            color: #4f46e5;
        }
        .comment-card p {
            margin: 0;
            font-size: 15px;
            color: #374151;
            line-height: 1.5;
        }
        .comment-empty {
            color: #9ca3af;
            text-align: center;
            margin-top: 60px;
        }
        .messages {
            flex: 1;
            padding: 24px 28px 10px;
            overflow-y: auto;
        }
        .message-row {
            display: flex;
            margin-bottom: 16px;
        }
        .message-row.user {
            justify-content: flex-end;
        }
        .message-row.bot {
            justify-content: flex-start;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            background: #fff;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            margin-left: auto;
            background: #4f46e5;
            color: #fff;
        }
        .message.bot {
            background: #fff;
        }
        .message-meta {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 4px;
            display: block;
        }
        .composer {
            padding: 16px 28px 24px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
        }
        .composer form {
            display: flex;
            gap: 12px;
        }
        .composer textarea {
            flex: 1;
            resize: none;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            min-height: 56px;
            transition: border 0.2s ease;
        }
        .composer textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }
        .composer button {
            min-width: 96px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .composer button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        @media (max-width: 960px) {
            .sidebar {
                width: 220px;
            }
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">KUI Chat</div>
            <button class="new-chat-btn" id="new-chat">+ 新对话</button>
            <button class="new-chat-btn" id="feedback-btn" style="margin-top: 8px;">留言区（点击即可查看留言）</button>
        </div>
        <div class="history" id="thread-list"></div>
    </aside>
    <main class="chat-pane" id="chat-pane">
        <div class="chat-header">
            <h1 id="chat-title">开始新的对话</h1>
            <p id="chat-subtitle">像豆包一样简洁的对话体验</p>
        </div>
        <div class="messages" id="message-list"></div>
        <div class="composer">
            <form id="chat-form">
                <textarea id="chat-input" placeholder="输入消息..." rows="2"></textarea>
                <button type="submit" id="send-button">发送</button>
            </form>
        </div>
    </main>
    <section class="comment-pane" id="comment-pane" style="display:none;">
        <div class="comment-header">
            <div>
                <h1>留言区</h1>
                <p style="margin:8px 0 0;color:#6b7280;font-size:14px;">大家的留言都会展示在这里</p>
            </div>
            <div>
                <button id="refresh-comments" style="margin-right:8px;">刷新</button>
                <button id="back-to-chat">返回对话</button>
            </div>
        </div>
        <div class="comment-list" id="comment-list"></div>
    </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    const state = {
        threads: [],
        activeThreadId: null,
        view: "chat"
    };
    const FINAL_STREAM_NODE = "TextualNormsNode";
    const TYPEWRITER_INTERVAL = 20; // ms per character

    function createThread() {
        const id = `local-${Date.now()}`;
        state.threads.unshift({
            id,
            title: "新的对话",
            threadId: null,
            messages: [],
            lastStreamHadContent: false,
            lastStreamCompleted: false
        });
        state.activeThreadId = id;
        renderThreads();
        renderMessages();
        focusInput();
    }

    function setActiveThread(id) {
        state.activeThreadId = id;
        renderThreads();
        renderMessages();
        focusInput();
    }

    function getActiveThread() {
        return state.threads.find(t => t.id === state.activeThreadId);
    }

    function renderThreads() {
        const list = document.getElementById("thread-list");
        list.innerHTML = "";
        if (!state.threads.length) {
            const empty = document.createElement("div");
            empty.style.color = "#9ca3af";
            empty.style.fontSize = "14px";
            empty.textContent = "暂无会话，点击上方按钮开始";
            list.appendChild(empty);
            return;
        }
        state.threads.forEach(thread => {
            const item = document.createElement("div");
            item.className = "thread" + (thread.id === state.activeThreadId ? " active" : "");
            item.addEventListener("click", () => setActiveThread(thread.id));

            const title = document.createElement("div");
            title.className = "thread-title";
            title.textContent = thread.title;

            const preview = document.createElement("div");
            preview.className = "thread-preview";
            const lastMessage = thread.messages[thread.messages.length - 1];
            preview.textContent = lastMessage?.content || "空会话";

            item.append(title, preview);
            list.appendChild(item);
        });
    }

    function renderMessages() {
        const container = document.getElementById("message-list");
        const thread = getActiveThread();
        container.innerHTML = "";

        if (!thread) {
            document.getElementById("chat-title").textContent = "开始新的对话";
            document.getElementById("chat-subtitle").textContent = "像豆包一样简洁的对话体验";
            return;
        }

        document.getElementById("chat-title").textContent = thread.title;
        document.getElementById("chat-subtitle").textContent = thread.threadId ? `threadId: ${thread.threadId}` : "等待首次回复";

        thread.messages.forEach(msg => {
            const row = document.createElement("div");
            row.className = `message-row ${msg.role}`;

            const bubble = document.createElement("div");
            bubble.className = `message ${msg.role}`;

            if (msg.stage) {
                const stageLabel = document.createElement("span");
                stageLabel.className = "message-meta";
                stageLabel.textContent = `节点：${msg.stage}`;
                bubble.appendChild(stageLabel);
            }

            if (msg.role === "bot" && msg.intent) {
                const meta = document.createElement("span");
                meta.className = "message-meta";
                meta.textContent = `意图：${msg.intent}`;
                bubble.appendChild(meta);
            }

            const content = document.createElement("div");
            if (msg.role === "bot" && msg.isMarkdown && window.marked) {
                content.innerHTML = marked.parse(msg.content || "");
            } else {
                content.textContent = msg.content;
            }
            bubble.append(content);
            row.appendChild(bubble);
            container.appendChild(row);
        });

        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(content) {
        const thread = getActiveThread();
        if (!thread) {
            createThread();
            return sendMessage(content);
        }

        thread.lastStreamHadContent = false;
        thread.lastStreamCompleted = false;
        thread.messages.push({ role: "user", content });
        renderMessages();

        setComposerDisabled(true);
        try {
            await streamWorkflow(thread, content);
            thread.title = thread.messages[0]?.content.slice(0, 12) || "新的对话";
        } catch (error) {
            if (!thread.lastStreamHadContent) {
                thread.messages.push({
                    role: "bot",
                    content: `请求失败：${error.message}`
                });
            } else {
                console.warn("Stream finished with client-side error after delivering content", error);
            }
        } finally {
            renderThreads();
            renderMessages();
            setComposerDisabled(false);
        }
    }

    async function streamWorkflow(thread, content) {
        const response = await fetch("/stream/api/workflow", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/x-ndjson"
            },
            body: JSON.stringify({
                messages: { content, role: "user" },
                threadId: thread.threadId
            })
        });

        if (!response.ok) {
            const text = await response.text().catch(() => "");
            throw new Error(text || "服务暂时不可用");
        }

        if (!response.body || !response.body.getReader) {
            throw new Error("当前浏览器不支持流式响应");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
            const { value, done } = await reader.read();
            if (done) {
                break;
            }
            buffer += decoder.decode(value, { stream: true });
            buffer = processNdjsonBuffer(buffer, chunk => handleStreamChunk(thread, chunk));
        }

        if (buffer.trim()) {
            processNdjsonBuffer(buffer + "\n", chunk => handleStreamChunk(thread, chunk));
        }
    }

    function processNdjsonBuffer(buffer, onChunk) {
        const lines = buffer.split("\n");
        const rest = lines.pop() ?? "";
        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) {
                return;
            }
            try {
                const chunk = JSON.parse(trimmed);
                onChunk(chunk);
            } catch (error) {
                console.error("解析流式数据失败", error);
            }
        });
        return rest;
    }

    function handleStreamChunk(thread, chunk) {
        if (!chunk) {
            return;
        }
        const chunkIsMarkdown = Boolean(chunk.isMarkdown);
        if (!thread.threadId && chunk.threadId) {
            thread.threadId = chunk.threadId;
            renderThreads();
        }

        if (chunk.error) {
            thread.messages.push({
                role: "bot",
                content: chunk.error,
                stage: "error",
                isMarkdown: false
            });
            renderMessages();
            return;
        }

        const stage = chunk.stage || chunk.node;
        if (stage !== FINAL_STREAM_NODE) {
            return;
        }
        if (!chunk.content) {
            return;
        }

        thread.lastStreamHadContent = true;
        if (chunk.end) {
            thread.lastStreamCompleted = true;
        }
        let message = findLastMessageByStage(thread.messages, stage);
        if (!message || !message.streaming) {
            message = {
                role: "bot",
                content: "",
                fullContent: chunk.content,
                intent: chunk.intent,
                stage,
                streaming: true,
                displayIndex: 0,
                animationHandle: null,
                isMarkdown: chunkIsMarkdown
            };
            thread.messages.push(message);
            startTypewriterAnimation(message);
        } else {
            message.fullContent = chunk.content;
            message.intent = chunk.intent ?? message.intent;
            if (chunk.isMarkdown !== undefined) {
                message.isMarkdown = chunkIsMarkdown;
            }
            if (!message.animationHandle) {
                startTypewriterAnimation(message);
            }
        }

        if (chunk.end) {
            message.streaming = false;
        }
        renderMessages();
    }

    function findLastMessageByStage(messages, stage) {
        for (let i = messages.length - 1; i >= 0; i--) {
            if (messages[i].stage === stage) {
                return messages[i];
            }
        }
        return null;
    }

    function startTypewriterAnimation(message) {
        if (!message) {
            return;
        }
        message.displayIndex = message.displayIndex || 0;
        if (message.animationHandle) {
            clearTimeout(message.animationHandle);
        }

        const step = () => {
            const text = message.fullContent || "";
            if (message.displayIndex < text.length) {
                message.displayIndex += 1;
                message.content = text.slice(0, message.displayIndex);
                renderMessages();
                message.animationHandle = setTimeout(step, TYPEWRITER_INTERVAL);
            } else {
                message.content = text;
                message.streaming = false;
                message.animationHandle = null;
                renderMessages();
            }
        };
        step();
    }

    function setComposerDisabled(disabled) {
        document.getElementById("chat-input").disabled = disabled;
        document.getElementById("send-button").disabled = disabled;
    }

    function focusInput() {
        const input = document.getElementById("chat-input");
        input.focus();
    }

    document.getElementById("new-chat").addEventListener("click", createThread);

    document.getElementById("feedback-btn").addEventListener("click", () => {
        state.view = "comments";
        document.getElementById("chat-pane").style.display = "none";
        document.getElementById("comment-pane").style.display = "flex";
        document.getElementById("comment-list").innerHTML = "<div class='comment-empty'>加载中...</div>";
        fetchComments();
    });

    document.getElementById("back-to-chat").addEventListener("click", () => {
        state.view = "chat";
        document.getElementById("comment-pane").style.display = "none";
        document.getElementById("chat-pane").style.display = "flex";
    });

    document.getElementById("refresh-comments").addEventListener("click", fetchComments);

    async function fetchComments() {
        try {
            const response = await fetch("/kui/comment");
            const data = await response.json();
            renderComments(data);
        } catch (error) {
            document.getElementById("comment-list").innerHTML = "<div class='comment-empty'>获取留言失败，请稍后再试</div>";
        }
    }

    function renderComments(data) {
        const container = document.getElementById("comment-list");
        container.innerHTML = "";
        const entries = Object.entries(data || {});
        if (!entries.length) {
            container.innerHTML = "<div class='comment-empty'>暂无留言，快来留下第一条吧</div>";
            return;
        }
        entries.forEach(([id, message]) => {
            const card = document.createElement("div");
            card.className = "comment-card";
            const title = document.createElement("h3");
            title.textContent = id || "匿名";
            const content = document.createElement("p");
            content.textContent = message;
            card.append(title, content);
            container.appendChild(card);
        });
    }

    document.getElementById("chat-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text) {
            return;
        }
        input.value = "";
        sendMessage(text);
    });

    createThread();
</script>
</body>
</html>
